# FreezingArchRule 위반 저장소 — 도입 시점 위반만 허용하고 새 위반은 실패시킨다(LayerArchitectureTest).
# 저장소는 커밋 대상이다. 위반이 해소되면 다음 실행에서 해당 줄이 자동 삭제되므로 그 변경도 함께 커밋한다.
freeze.store.default.path=src/test/resources/archunit_store
# 저장소가 없을 때 새로 만들지 여부. 최초 생성 후 false로 두어, 저장소가 누락된 환경(CI 등)에서
# 모든 위반이 조용히 "기존 위반"으로 박제되는 일을 막는다.
freeze.store.default.allowStoreCreation=false
