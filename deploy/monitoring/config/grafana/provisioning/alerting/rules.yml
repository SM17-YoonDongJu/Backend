              refId: A
              queryMode: Metrics
              metricQueryType: 0
              metricEditorMode: 0
              region: default
              namespace: AWS/SQS
              metricName: ApproximateNumberOfMessagesVisible
              dimensions:
                QueueName:
                  - brbs-ocr-job-queue-dev-dlq
                  - brbs-report-job-queue-dev-dlq
              matchExact: true
              statistic: Maximum
              period: "300"
              datasource:
                type: cloudwatch
                uid: cloudwatch
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
