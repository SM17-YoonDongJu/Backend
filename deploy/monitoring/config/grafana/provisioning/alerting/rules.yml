      # 두 워커는 수신 횟수가 SQS_MAX_RECEIVE_COUNT(3)를 넘은 메시지를 실패 저널에 적고 지운다. 큐의 redrive 상한(5)이
      # 그보다 먼저 걸리면 SQS가 기록 없이 DLQ로 옮기고, 그 청구는 pending에 멈춘다 — 정상이면 DLQ는 늘 비어 있다.
      - uid: brbs-sqs-dlq-not-empty
