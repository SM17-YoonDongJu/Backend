name: Deploy to Dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  ECR_REPOSITORY: soma/backend
  IMAGE_TAG: ${{ github.sha }}
  EC2_INSTANCE_NAME: brbs-backend-dev
  EC2_USER: ubuntu
  EC2_HOME: /home/ubuntu

jobs:
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.build.outputs.short_sha }}
      image_uri: ${{ steps.build.outputs.image_uri }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Build & push Docker image
        id: build
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY"
          
          echo "Building: $IMAGE_URI"
          
          docker build \
            --tag $IMAGE_URI:$IMAGE_TAG \
            --tag $IMAGE_URI:$SHORT_SHA \
            --tag $IMAGE_URI:dev \
            .
          
          docker push $IMAGE_URI:$IMAGE_TAG
          docker push $IMAGE_URI:$SHORT_SHA
          docker push $IMAGE_URI:dev
          
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT
          
          echo "===== Pushed ====="
          echo "$IMAGE_URI:$SHORT_SHA"
          echo "$IMAGE_URI:dev"
  
  deploy-to-ec2:
    name: Deploy to EC2 via SSM
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Find dev EC2 instance
        id: find-instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$EC2_INSTANCE_NAME" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)
          
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" == "None" ]; then
            echo "::error::Running instance with tag Name=$EC2_INSTANCE_NAME not found"
            exit 1
          fi
          
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "Found: $INSTANCE_ID"
      
      - name: Deploy via SSM
        env:
          INSTANCE_ID: ${{ steps.find-instance.outputs.instance_id }}
          REGISTRY: ${{ secrets.AWS_ECR_REGISTRY }}
          REGION: ${{ secrets.AWS_REGION }}
          SHORT_SHA: ${{ needs.build-and-push.outputs.short_sha }}
        run: |
          # 리포의 배포 compose를 base64로 인코딩해 SSM 커맨드로 EC2에 그대로 기록(드리프트 차단)
          COMPOSE_B64=$(base64 -w0 deploy/docker-compose.dev.yml)

          # 관측성 설정(deploy/monitoring: prometheus·grafana provisioning·대시보드)도 같은 방식으로 동기화(#88).
          # 볼륨 바인드 마운트 대상이라 EC2 디스크에 실파일이 있어야 한다. 대시보드 JSON이 커서 tar.gz로 묶어 싣고,
          # SSM Parameters 총량 한도(100KB) 보호를 위해 90KB 초과 시 실패시킨다(초과하게 되면 S3 경유로 전환할 것).
          tar -czf /tmp/monitoring.tar.gz -C deploy monitoring
          MONITORING_B64=$(base64 -w0 /tmp/monitoring.tar.gz)
          if [ "${#MONITORING_B64}" -gt 92160 ]; then
            echo "::error::deploy/monitoring 페이로드(${#MONITORING_B64}B)가 SSM 한도(90KB)에 근접 — S3 경유 동기화로 전환 필요"
            exit 1
          fi

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy soma/backend $SHORT_SHA" \
            --parameters "{
              \"commands\": [
                \"set -e\",
                \"cd $EC2_HOME/backend\",
                \"echo '===== compose 동기화(리포 기준) ====='\",
                \"echo $COMPOSE_B64 | base64 -d > docker-compose.yml\",
                \"echo '===== monitoring 설정 동기화(리포 기준, #88) ====='\",
                \"echo $MONITORING_B64 | base64 -d > /tmp/monitoring.tar.gz\",
                \"rm -rf monitoring\",
                \"tar -xzf /tmp/monitoring.tar.gz -C .\",
                \"rm -f /tmp/monitoring.tar.gz\",
                \"docker compose --env-file .env.dev kill -s SIGHUP prometheus 2>/dev/null || true\",
                \"echo '===== ECR 로그인 ====='\",
                \"aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $REGISTRY\",
                \"echo '===== 이미지 pull ====='\",
                \"docker compose --env-file .env.dev pull backend\",
                \"echo '===== 컨테이너 재시작 ====='\",
                \"docker compose --env-file .env.dev up -d --no-deps backend\",
                \"echo '===== 이미지 정리 ====='\",
                \"docker image prune -f\",
                \"echo '===== 배포 완료 ====='\"
              ],
              \"executionTimeout\": [\"600\"]
            }" \
            --output text \
            --query 'Command.CommandId')
          
          echo "Command ID: $COMMAND_ID"
          
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")
            
            echo "[$i/60] Status: $STATUS"
            
            case "$STATUS" in
              Success)
                echo "Deploy 성공"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text
                break
                ;;
              Failed|Cancelled|TimedOut)
                echo "::error::Deploy 실패: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardErrorContent' \
                  --output text
                exit 1
                ;;
            esac
            
            sleep 5
          done
  
  notify:
    name: Notify Discord
    needs: [build-and-push, deploy-to-ec2]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Notify
        uses: ./.github/actions/discord-notify
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_DEPLOYMENT }}
          status: ${{ (needs.build-and-push.result == 'success' && needs.deploy-to-ec2.result == 'success') && 'success' || 'failure' }}
          title: 'Backend Dev 배포 ${{ (needs.build-and-push.result == ''success'' && needs.deploy-to-ec2.result == ''success'') && ''완료'' || ''실패'' }}'
          service: backend
          environment: dev
          image_tag: ${{ needs.build-and-push.outputs.short_sha }}
