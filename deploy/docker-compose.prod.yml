# prod EC2 배포용 compose (단일 진실원). 서버에서 수동 편집하지 말고 이 파일을 PR로 수정한다.
# 사용: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# CD(main push)는 backend만 bounce: ... up -d --no-deps backend
# 인프라(redis)는 최초 1회 full up 후 restart 정책으로 상주한다. OCR 트리거 브로커는 AWS SQS(관리형, 컨테이너 없음).
# dev와의 차이: 프로파일 prod · 이미지 태그 prod · actuator 9292를 ALB 헬스체크용으로 호스트 게시.
name: brbs

services:
  backend:
    image: ${ECR_REGISTRY}/soma/backend:${BACKEND_TAG:-prod}
    container_name: brbs-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
      # actuator 관리 포트(9292)를 ALB 헬스체크용으로 호스트 게시.
      # ⚠️ 인스턴스 SG에서 ALB SG로부터의 9292 인바운드만 허용할 것(외부 직접 노출 금지).
      - "9292:9292"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      # OCR 트리거는 SQS로 발행. 큐 이름은 .env의 SQS_OCR_QUEUE_NAME(brbs-ocr-job-queue-prod)으로 주입하고,
      # backend가 그 이름에서 URL을 런타임 해석한다(URL env 불필요). 접속은 IAM Role 위임(AWS_REGION 아래 참조).
      SQS_OCR_QUEUE_NAME: ${SQS_OCR_QUEUE_NAME}
      JWT_SECRET: ${JWT_SECRET}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET: ${S3_BUCKET}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      # Apple(Web/Services ID): 콘솔 발급 4개 + refresh_token 암호화 키 1개(우리 생성). 값은 .env.prod에서 주입(미설정 시 apple 로그인만 비활성)
      APPLE_TEAM_ID: ${APPLE_TEAM_ID}
      APPLE_KEY_ID: ${APPLE_KEY_ID}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY}
      APPLE_TOKEN_ENC_KEY: ${APPLE_TOKEN_ENC_KEY}
      # PII 컬럼(user_claims·user_insurances) 암호화 — 운영은 KMS 봉투암호화 경로만 허용(PII_ENC_KEY 미주입).
      # CMK 없이 배포하면 PiiCryptoProdGuard가 기동을 막는다 — 값은 CMK 생성 후 .env.prod에서 주입.
      PII_KMS_KEY_ID: ${PII_KMS_KEY_ID}
      # OAuth redirect_uri {baseUrl} 치환값 = 백엔드 API 도메인
      OAUTH_BASE_URL: ${OAUTH_BASE_URL:-https://api.brbosang.com}
      # 프론트가 콜백에 넘긴 redirect_uri를 허용할 오리진 = 프론트 도메인(API 아님)
      OAUTH_ALLOWED_REDIRECT_ORIGINS: ${OAUTH_ALLOWED_REDIRECT_ORIGINS:-https://brbosang.com,https://www.brbosang.com}
      # 쿠키 인증 CORS 허용 오리진 = 프론트 도메인(쿠키 인증이라 * 불가)
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-https://brbosang.com,https://www.brbosang.com}
      # prod는 HTTPS. 프론트(brbosang.com)·API(api.brbosang.com)는 same-site라 SameSite=Lax로 충분(None 불필요)
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
      AI_SERVICE_URL: ${AI_SERVICE_URL}
      # actuator 관리 포트 분리(9292). health·metrics·prometheus를 관리 포트로 격리
      MANAGEMENT_SERVER_PORT: ${MANAGEMENT_SERVER_PORT:-9292}
      TZ: Asia/Seoul
    # JVM은 -XX:MaxRAMPercentage=75.0(Dockerfile)이라 mem_limit 없으면 호스트 전체 메모리 기준으로 힙을 잡는다.
    # 인스턴스 축소(t3.medium) 대비 컨테이너 몫을 명시해 report·redis와 공존 가능하게 고정.
    mem_limit: 1536m
    mem_reservation: 768m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9292/actuator/health/readiness | grep -q UP || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - brbs-net

  # SQS 워커(OCR 트리거 소비 · LangGraph · RAG). AI 레포가 이미지 배포. HTTP 서버 없음 → 포트/HTTP 헬스체크 미노출.
  # ⚠️ AI_BASE_URL(GPU 인스턴스) 연결 전에는 기동 실패할 수 있음 — backend는 --no-deps라 독립.
  report:
    image: ${ECR_REGISTRY}/soma/report:${REPORT_TAG:-prod}
    container_name: brbs-report
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-prod}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: report-worker
      INSTANCE_ID: ${INSTANCE_ID:-}
      DATABASE_URL: ${DATABASE_URL}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-2}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      RDS_CA_PATH: ${RDS_CA_PATH:-}
      REDIS_URL: ${REDIS_URL}
      # OCR 트리거 SQS 소비 (Kafka→SQS 전환, #208). ⚠️ 변수명·튜닝값은 AI report 워커의 SQS 소비자 구현과 합의 후 확정.
      # (튜닝 후보: 롱폴링 wait-time·visibility-timeout·배치 max-messages. DLQ는 큐 redrive policy로 구성 — 앱 env 아님.)
      SQS_OCR_JOB_QUEUE_URL: ${SQS_OCR_JOB_QUEUE_URL}
      # SQS 접속·큐 URL 해석에 리전 필요 — 자격증명은 인스턴스 IAM Role 위임(정적 키 미주입)
      AWS_REGION: ${AWS_REGION}
      AI_BASE_URL: ${AI_BASE_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
      LLM_MODEL: ${LLM_MODEL}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIM: ${EMBEDDING_DIM}
      USE_NER: ${USE_NER:-false}
      NER_MODEL: ${NER_MODEL:-}
      NER_SCORE_THRESHOLD: ${NER_SCORE_THRESHOLD:-}
      TZ: Asia/Seoul
    # 자체 메모리 캡 메커니즘이 없는 프로세스라 하드 상한으로 보호(실측 안정 시 577MB 기준 여유분 포함).
    mem_limit: 768m
    mem_reservation: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - brbs-net

  # FastAPI WebSocket 챗봇(RAG+가드레일+LLM). SQS·S3 없음, Redis 필수.
  chatbot:
    image: ${ECR_REGISTRY}/soma/chatbot:${CHATBOT_TAG:-prod}
    container_name: brbs-chatbot
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-prod}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: chatbot
      INSTANCE_ID: ${INSTANCE_ID:-}
      DATABASE_URL: ${DATABASE_URL}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-2}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      RDS_CA_PATH: ${RDS_CA_PATH:-}
      REDIS_URL: ${REDIS_URL}
      AI_BASE_URL: ${AI_BASE_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
      LLM_MODEL: ${LLM_MODEL}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIM: ${EMBEDDING_DIM}
      USE_NER: ${USE_NER:-false}
      NER_MODEL: ${NER_MODEL:-}
      NER_SCORE_THRESHOLD: ${NER_SCORE_THRESHOLD:-}
      TZ: Asia/Seoul
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - brbs-net

  redis:
    image: redis:7-alpine
    container_name: brbs-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - brbs-net

volumes:
  redis-data:

networks:
  brbs-net:
    driver: bridge
