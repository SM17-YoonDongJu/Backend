# 알림 룰 17종 (#88 보너스 6종 + OCR 파이프라인 3종 + GPU 3종 + 약관 인덱싱 5종) — 1분 평가, BRBS 폴더.
# 설계 원칙:
#  - NoData → OK: dev 무트래픽·미배포 exporter(brbs-etl #257, brbs-ai) 침묵(오발화 방지)
#  - Error → OK, 단 TargetDown만 Error → Alerting: Prometheus(데이터소스) 자체 장애를 대표 1건으로 감지
#  - TargetDown은 job 무관 up 전체 커버 → brbs-etl·brbs-ai 타깃이 추가되는 순간 자동 커버(후속 룰 불필요)
#  - 임계값은 보수적 초기값 — 운영하며 튜닝
apiVersion: 1
groups:
  - orgId: 1
    name: brbs-alerts
    folder: BRBS
    interval: 1m
    rules:
      - uid: brbs-target-down
        title: "TargetDown - 스크랩 타깃 다운"
        condition: C
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "타깃 다운: {{ $labels.job }} / {{ $labels.instance }}"
          description: "2분 이상 스크랩 실패(up==0). 컨테이너 상태(docker ps)·네트워크를 확인. 이 룰만 Error=Alerting이라 Prometheus 장애 시에도 발화한다."
        noDataState: OK
        execErrState: Alerting
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'up'
              instant: true
              range: false
              refId: A
              legendFormat: "{{job}}/{{instance}}"
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      - uid: brbs-high-5xx
        title: "High5xxRate - HTTP 5xx 에러율 5% 초과"
        condition: C
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "backend 5xx 에러율이 5%를 초과"
          description: "5분 지속. 최소 트래픽 가드(>0.1 req/s)가 있어 저트래픽 오발화는 걸러진다. 앱 로그·최근 배포를 확인."
        noDataState: OK
        execErrState: OK
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: '(sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count[5m]))) and (sum(rate(http_server_requests_seconds_count[5m])) > 0.1)'
              instant: true
              range: false
              refId: A
              legendFormat: "5xx ratio"
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0.05]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      - uid: brbs-high-cpu
        title: "HighCpu - CPU 85% 초과"
        condition: C
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CPU 과부하: {{ $labels.instance }}"
          description: "10분 지속 85% 초과. t3는 콜로케이트(앱+인프라+모니터링)라 원인 컨테이너를 cost-optimization 대시보드 Top10에서 확인."
        noDataState: OK
        execErrState: OK
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: '100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)'
              instant: true
              range: false
              refId: A
              legendFormat: "{{instance}}"
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [85]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      - uid: brbs-high-memory
        title: "HighMemory - 메모리 90% 초과"
        condition: C
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "메모리 압박: {{ $labels.instance }}"
          description: "10분 지속 90% 초과 — OOM 전조. 컨테이너별 소비는 cost-optimization 대시보드에서 확인."
        noDataState: OK
        execErrState: OK
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: '(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100'
              instant: true
              range: false
              refId: A
              legendFormat: "{{instance}}"
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [90]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      - uid: brbs-disk-filling
        title: "DiskFilling - 디스크 80% 초과"
        condition: C
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "디스크 사용률 80% 초과: {{ $labels.instance }}"
          description: "TSDB(retention 15d)·로그·kafka 데이터 축적 확인. 7일 예측은 cost-optimization 대시보드 참조."
        noDataState: OK
        execErrState: OK
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: '(1 - (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"})) * 100'
              instant: true
              range: false
              refId: A
              legendFormat: "{{instance}}"
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [80]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      - uid: brbs-hikari-saturated
        title: "HikariSaturated - DB 커넥션 풀 대기 발생"
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HikariCP 대기 스레드 발생(풀 포화)"
          description: "5분 지속 pending>0 — 커넥션을 못 받은 요청이 대기 중. 느린 쿼리·풀 크기(maximum-pool-size)·커넥션 누수를 확인."
        noDataState: OK
        execErrState: OK
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'hikaricp_connections_pending'
              instant: true
              range: false
              refId: A
              legendFormat: "{{pool}}"
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      # ── OCR 파이프라인(발행=backend / 소비=report 워커) ──
      # 워커는 HTTP 서버가 없어 /metrics 스크랩이 불가하다(TargetDown 룰이 못 잡는다) — 그래서 "컨테이너가
      # 떠 있는가"는 cAdvisor로, "일을 하고 있는가"는 로그로 본다. 워커가 /metrics를 노출하면
      # prometheus.yml의 ocr-worker job을 켜고 여기에 처리량·실패율 룰을 추가한다.
      - uid: brbs-ocr-worker-down
        title: "OcrWorkerDown - OCR 워커 컨테이너 없음"
        condition: C
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "OCR 워커(brbs-report) 컨테이너가 보이지 않음"
          description: "5분 이상 cAdvisor에 brbs-report가 없다 — 컨테이너가 죽었거나 이름이 바뀌었다. OCR 트리거를 아무도 소비하지 않으므로 리포트 생성이 멈춘다(메시지는 큐에 4일 보관). 앱 인스턴스에서 docker ps·docker logs brbs-report 확인."
        noDataState: OK
        execErrState: OK
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            # absent()는 시계열이 있으면 빈 결과(→NoData=OK로 침묵), 없으면 1을 낸다.
            model:
              expr: 'absent(container_last_seen{name="brbs-report"})'
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      - uid: brbs-ocr-worker-not-consuming
        title: "OcrWorkerNotConsuming - OCR 워커가 큐를 읽지 못함"
        condition: C
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "OCR 워커가 SQS 수신에 반복 실패 중"
          description: "10분 넘게 'sqs receive failed'가 쏟아진다 — 컨테이너는 살아 있지만 큐를 못 읽는 상태다. SQS_OCR_JOB_QUEUE_URL 주입 여부(2026-08-13 실제 원인)·IAM(Receive/Delete)·큐 이름을 확인. 발행은 정상인데 소비만 끊기면 이 룰만 발화한다."
        noDataState: OK
        execErrState: OK
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            # ⚠️ 워커(AI 레포)의 로그 문구에 의존한다 — 문구가 바뀌면 이 룰은 조용히 죽는다.
            # 정상 시 0건이라 NoData=OK로 침묵하고, 초당 1회 재시도가 5분 이어지면 ~300건이 된다.
            model:
              refId: A
              expr: 'sum(count_over_time({service="brbs-report"} |= "sqs receive failed" [5m]))'
              queryType: instant
              datasource:
                type: loki
                uid: loki
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [60]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      - uid: brbs-outbox-relay-failing
        title: "OutboxRelayFailing - OCR 트리거 발행 실패"
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "아웃박스 릴레이가 SQS 발행에 실패 중"
          description: "10분 내 발행 실패가 있었다. 5회를 넘기면 FAILED로 파킹돼 자동 재시도가 끝나므로(수동 복구 필요) 큐 이름(SQS_OCR_QUEUE_NAME)·IAM(SendMessage/GetQueueUrl)을 확인. 로그: {service=\"brbs-backend\"} |= \"아웃박스 이벤트 발행 실패\""
        noDataState: OK
        execErrState: OK
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            # OutboxRelay가 발행 결과를 카운터로 남긴다(outbox.relay.failed → outbox_relay_failed_total).
            # 이 메트릭이 배포되기 전에는 시계열이 없어 NoData=OK로 침묵한다.
            model:
              expr: 'sum(increase(outbox_relay_failed_total[10m]))'
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      # ── GPU(g6=brbs-ai, 10.0.11.93) — dcgm-exporter/cAdvisor 기반. dcgm-gpu·cadvisor-gpu 타깃 UP 시부터 평가 ──
      # 타깃 자체 다운은 기존 TargetDown(critical, 2m)이 커버하므로 여기선 GPU 고유 신호만 다룬다.
      - uid: brbs-gpu-vram-high
        title: "GpuVramHigh - GPU VRAM 95% 초과(포화·OOM 전조)"
        condition: C
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "GPU VRAM 포화: {{ $labels.instance }} gpu{{ $labels.gpu }}"
          description: "10분 지속 VRAM 95% 초과. 모델이 VRAM을 채우는 건 정상이나, ~100% 고정은 추가 로드 실패·언로드/재로드 스래싱(수십초 지연)·OOM 전조다(70b OOM 이력). ollama 로그의 unload/OOM과 gpu-dcgm 대시보드를 확인."
        noDataState: OK
        execErrState: OK
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'max by(instance, gpu) (DCGM_FI_DEV_FB_USED / (DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE))'
              instant: true
              range: false
              refId: A
              legendFormat: "{{instance}} gpu{{gpu}}"
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0.95]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      - uid: brbs-gpu-temp-high
        title: "GpuTempHigh - GPU 온도 85도 초과(스로틀링)"
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GPU 온도 과열: {{ $labels.instance }} gpu{{ $labels.gpu }}"
          description: "5분 지속 85℃ 초과 — 조용한 성능 저하(클럭 스로틀링) 구간. gpu-dcgm 대시보드에서 전력·SM clock 동반 하락을 확인. 지속되면 워크로드/냉각을 점검."
        noDataState: OK
        execErrState: OK
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'max by(instance, gpu) (DCGM_FI_DEV_GPU_TEMP)'
              instant: true
              range: false
              refId: A
              legendFormat: "{{instance}} gpu{{gpu}}"
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [85]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      # ollama는 HTTP 스크랩 대상이 아니라(무인증 서버) 컨테이너 생존을 cAdvisor(g6)로 본다 — OcrWorkerDown과 동형.
      - uid: brbs-ollama-down
        title: "OllamaDown - ollama 컨테이너 없음"
        condition: C
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "ollama(brbs-ollama) 컨테이너가 보이지 않음"
          description: "5분 이상 cAdvisor(g6)에 brbs-ollama가 없다 — 컨테이너가 죽었거나 이름이 바뀌었다. ollama가 없으면 report·chatbot의 LLM/임베딩과 ocr-worker 임베딩이 전부 실패한다. g6에서 docker ps·docker logs brbs-ollama 확인."
        noDataState: OK
        execErrState: OK
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            # absent()는 시계열이 있으면 빈 결과(→NoData=OK로 침묵), 없으면 1을 낸다.
            model:
              expr: 'absent(container_last_seen{name="brbs-ollama"})'
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      # ── 약관 인덱싱(insurance-chunker, brbs-etl) ──
      # 배치 잡이라 알림 규칙이 다르다. 주기가 7일(INGEST_INTERVAL_SECONDS=604800)이므로 7일 중 6일 23시간 동안
      # 처리량 0이 정상이다 — "5분간 처리 0건" 같은 활동 기반 룰은 상시 발화하므로 두지 않는다.
      # 주 신호는 rate가 아니라 신선도 게이지이고, 컨테이너 자체가 죽는 건 기존 TargetDown이 커버한다.

      - uid: brbs-index-stale
        title: "IndexStale - 약관 인덱싱이 한 주기 반 넘게 성공하지 못함"
        condition: C
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "약관 인덱싱 신선도 초과 — 마지막 성공이 10.5일을 넘겼다"
          description: "이 서비스의 유일한 진짜 SLI다. 임계 907200s는 컨테이너 healthcheck.py와 같은 식(주기 604800 x HEALTH_GRACE_FACTOR 1.5)이라 앱 쪽 grace factor를 바꾸면 이 룰도 같이 바꿔야 한다. 데몬은 사이클이 실패해도 예외를 삼키고 다음 주기를 기다리므로 컨테이너는 running인 채로 몇 주째 인덱싱이 안 될 수 있다. brbs-etl에서 docker logs brbs-insurance-chunker 확인."
        noDataState: OK
        execErrState: OK
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            # 604800(7d) x 1.5 = 907200s. 아래 threshold의 숫자가 이 식의 결과다.
            model:
              expr: 'time() - insurance_chunker_last_success_timestamp_seconds'
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [907200]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      - uid: brbs-index-cycle-failed
        title: "IndexCycleFailed - 마지막 인덱싱 사이클 실패"
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "약관 인덱싱 사이클이 실패로 끝났다"
          description: "IndexStale은 마지막 성공이 10.5일을 넘겨야 울리므로, 사이클이 실패해도 그때까지는 아무 신호가 없다. 이 룰이 그 간극을 메운다 — 실패를 몇 분 안에 알린다. 데몬은 사이클이 죽어도 다음 주기를 기다리며 살아 있으므로 컨테이너 상태로는 구분되지 않는다. brbs-etl에서 docker logs brbs-insurance-chunker 확인. 상태 파일이 빈 새 볼륨에서는 첫 사이클이 끝나기 전까지 0이라 IndexNeverSucceeded와 같이 울린다."
        noDataState: OK
        execErrState: OK
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            # 재시작으로는 오발화하지 않는다 — record_start()가 기존 상태에 기동 시각만 덧쓰고
            # last_run_ok는 그대로 두므로, 직전 사이클 결과가 볼륨에 남아 있다.
            model:
              expr: 'insurance_chunker_last_cycle_success'
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      - uid: brbs-index-never-succeeded
        title: "IndexNeverSucceeded - 약관 인덱싱 성공 기록이 아예 없음"
        condition: C
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "insurance_chunker_last_success_timestamp_seconds 시계열이 없다"
          description: "함정 대응 룰이다. exporter는 last_success_at이 있을 때만 이 지표를 내보내므로, 한 번도 성공한 적이 없으면 시계열 자체가 없고 IndexStale의 뺄셈은 빈 결과가 된다(NoData=OK로 조용히 침묵). 즉 '한 번도 성공 못 한' 최악의 상태를 신선도 룰이 못 잡는다. 스크랩 타깃이 통째로 죽어도 같이 발화하지만 그건 TargetDown(2m)이 먼저 알려준다. 첫 사이클이 성공하면 자동으로 해제되고 이후로는 IndexStale이 이어받는다."
        noDataState: OK
        execErrState: OK
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            # absent()는 시계열이 있으면 빈 결과(→NoData=OK로 침묵), 없으면 1을 낸다.
            model:
              expr: 'absent(insurance_chunker_last_success_timestamp_seconds)'
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      - uid: brbs-index-quarantined
