spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:postgresql://localhost:5432/test_db
    username: test
    password: test
    driver-class-name: org.postgresql.Driver
    hikari:
      username: test
      password: test
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    security:
      protocol: PLAINTEXT
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: dummy
            client-secret: dummy
          naver:
            client-id: dummy
            client-secret: dummy

management:
  tracing:
    # 테스트 컨텍스트는 Tempo가 없다 — 트레이싱을 꺼서 OTLP export·네트워크 시도를 막는다.
    enabled: false

logging:
  file:
    path: /tmp/logs

app:
  cookie:
    secure: false
  outbox:
    enabled: false

jwt:
  secret: testsecretkeyforcitestingonly32chars!!

aws:
  region: ap-northeast-2
  s3:
    bucket: test-bucket