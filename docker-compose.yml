services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_NAME:-soma_db}
      POSTGRES_USER: ${DB_USER:-soma}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER:-soma} -d $${DB_NAME:-soma_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 로컬 SQS (LocalStack). 운영/스테이징은 관리형 AWS SQS. init 스크립트가 기동 시 ocr-job-queue를 생성한다.
  localstack:
    image: localstack/localstack:3
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    environment:
      SERVICES: sqs
      DEBUG: "0"
    volumes:
      - ./deploy/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name ocr-job-queue >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  app:
    profiles: [app]
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: oauth
      # 컨테이너 내부에서는 서비스명으로 LocalStack에 접속 (env_file .env 값보다 우선)
      AWS_REGION: ap-northeast-2
      AWS_SQS_ENDPOINT: http://localstack:4566
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 1g            # JVM MaxRAMPercentage=75% → 힙 약 768m
    volumes:
      - ./logs:/app/logs     # GC 로그·힙덤프 호스트 보존
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s      # 앱 부팅 대기

volumes:
  postgres_data:
  redis_data:
