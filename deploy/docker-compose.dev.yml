# dev EC2 배포용 compose (단일 진실원). 서버에서 수동 편집하지 말고 이 파일을 PR로 수정한다.
# 사용: docker compose -f docker-compose.dev.yml --env-file .env.dev up -d
# CD는 backend만 bounce: ... up -d --no-deps backend
# 인프라(redis)는 최초 1회 full up 후 restart 정책으로 상주한다. OCR 트리거 브로커는 AWS SQS(관리형, 컨테이너 없음).
name: brbs

services:
  backend:
    image: ${ECR_REGISTRY}/soma/backend:${BACKEND_TAG:-dev}
    container_name: brbs-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
      # actuator 관리 포트(9292): 호스트 전 인터페이스에 게시 (Prometheus 스크랩·운영자 접근)
      - "9292:9292"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      LOG_LEVEL: ${LOG_LEVEL}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      # OCR 트리거는 SQS로 발행. 큐 이름은 .env의 SQS_OCR_QUEUE_NAME(brbs-ocr-job-queue-dev)으로 주입하고,
      # backend가 그 이름에서 URL을 런타임 해석한다(URL env 불필요). 접속은 dev 인스턴스 IAM Role 위임(AWS_REGION 아래 참조).
      SQS_OCR_QUEUE_NAME: ${SQS_OCR_QUEUE_NAME}
      JWT_SECRET: ${JWT_SECRET}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET: ${S3_BUCKET}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      # Apple(Web/Services ID): 콘솔 발급 4개 + refresh_token 암호화 키 1개(우리 생성). 값은 .env.dev에서 주입(미설정 시 apple 로그인만 비활성)
      APPLE_TEAM_ID: ${APPLE_TEAM_ID}
      APPLE_KEY_ID: ${APPLE_KEY_ID}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY}
      # dev는 미설정 시 개발 전용 기본키로 기동한다(빈 값 주입 방지 — 빈 값은 기동 실패를 유발). 운영은 fail-fast.
      APPLE_TOKEN_ENC_KEY: ${APPLE_TOKEN_ENC_KEY:-ZGV2LWxvY2FsLWFwcGxlLXRva2VuLWVuYy1rZXkhISE=}
      # PII 컬럼(user_claims·user_insurances) 암호화 키. dev도 fallback 없이 .env.dev에서 반드시 주입한다
      # (Apple 키와 달리 dev가 실 배포 환경이라 레포에 커밋된 기본값을 그대로 쓰면 DB 덤프 유출 시 무의미해짐).
      PII_ENC_KEY: ${PII_ENC_KEY}
      # phone_number·provider_user_id HMAC 블라인드 인덱스 키(이슈 #232). report_worker는 이 조회를 하지
      # 않으므로 report 서비스에는 주입하지 않는다(backend 전용).
      PII_HMAC_KEY: ${PII_HMAC_KEY}
      # OAuth redirect_uri {baseUrl} 치환값(프론트 인가요청·provider 콘솔 등록 redirect_uri와 일치해야 함)
      OAUTH_BASE_URL: ${OAUTH_BASE_URL:-http://localhost:8080}
      OAUTH_ALLOWED_REDIRECT_ORIGINS: ${OAUTH_ALLOWED_REDIRECT_ORIGINS:-http://localhost:8080,http://localhost:3000,https://brbosang.com}
      # 쿠키 인증 CORS 허용 오리진(쉼표 구분 패턴). 프론트 오리진을 반드시 포함
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:3000}
      # cross-site HTTPS면 COOKIE_SECURE=true·COOKIE_SAME_SITE=None (평문 http면 false·Lax 유지)
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
      AI_SERVICE_URL: ${AI_SERVICE_URL}
      # actuator 관리 포트 분리: health·info·metrics·prometheus를 관리 포트(9292)로 격리해 앱 트래픽(8080)과 분리한다.
      # Prometheus는 brbs-net에서 backend:9292 스크랩, 헬스체크는 컨테이너 내부 localhost:9292로 접근.
      MANAGEMENT_SERVER_PORT: ${MANAGEMENT_SERVER_PORT:-9292}
      # 분산 트레이싱: Tempo가 있는 dev에서만 켠다(prod은 스택 미배포라 미주입 → OFF).
      # Tempo가 별도 모니터링 인스턴스로 분리되어(하단 관측성 섹션 참고) OTLP HTTP push 대상이 원격이다 —
      # 값은 .env.dev의 OTLP_TRACING_ENDPOINT(모니터링 인스턴스 private IP 기준)로 주입.
      TRACING_ENABLED: "true"
      OTLP_TRACING_ENDPOINT: ${OTLP_TRACING_ENDPOINT}
      # 샘플링(dev 전량=1.0). 운영 조정은 이 값만 교체.
      TRACING_SAMPLE_PROBABILITY: ${TRACING_SAMPLE_PROBABILITY:-1.0}
      TZ: Asia/Seoul
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9292/actuator/health/readiness | grep -q UP || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - brbs-net

  # SQS 워커(OCR 트리거 소비 · LangGraph · RAG). HTTP 서버 없음 → 포트/HTTP 헬스체크 미노출.
  report:
    image: ${ECR_REGISTRY}/soma/report:${REPORT_TAG:-dev}
    container_name: brbs-report
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      LOG_LEVEL: ${LOG_LEVEL}
      SERVICE_NAME: report-worker
      INSTANCE_ID: ${INSTANCE_ID:-}
      DATABASE_URL: ${DATABASE_URL}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-2}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      RDS_CA_PATH: ${RDS_CA_PATH:-}
      REDIS_URL: ${REDIS_URL}
      # PII 컬럼(user_claims.additional_information·description·question 등) 복호화 키. dev는 KMS를 안 쓰고
      # backend와 report가 같은 raw 키를 공유한다(같은 .env.dev에서 주입되는 같은 값) — report_worker가
      # 이 컬럼들을 직접 SQL로 읽으므로 복호화가 필요하다. 상세: docs/pii-encryption-report-worker-handoff.md
      PII_ENC_KEY: ${PII_ENC_KEY}
      # report-worker는 Backend의 OCR 트리거 큐를 직접 소비하지 않는다 — ocr-worker(별도 배포, 이 레포 밖)가
      # brbs-ocr-job-queue-dev를 소비해 OCR을 수행한 뒤 report-job 큐로 넘기고, report-worker는 그 결과만 받는다
      # (Backend → ocr-worker → report-worker 2홉). 변수명이 SQS_REPORT_JOB_QUEUE_URL인 이유.
      # (튜닝 후보: 롱폴링 wait-time·visibility-timeout·배치 max-messages. DLQ는 큐 redrive policy로 구성 — 앱 env 아님.)
      SQS_REPORT_JOB_QUEUE_URL: ${SQS_REPORT_JOB_QUEUE_URL}
      # SQS 접속·큐 URL 해석에 리전 필요 — 자격증명은 dev 인스턴스 IAM Role 위임(정적 키 미주입)
      AWS_REGION: ${AWS_REGION}
      AI_BASE_URL: ${AI_BASE_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
      LLM_MODEL: ${LLM_MODEL}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIM: ${EMBEDDING_DIM}
      USE_NER: ${USE_NER:-false}
      NER_MODEL: ${NER_MODEL:-}
      NER_SCORE_THRESHOLD: ${NER_SCORE_THRESHOLD:-}
      TZ: Asia/Seoul
    volumes:
      - /home/ubuntu/backend/certs/rds-global-bundle.pem:/etc/ssl/rds/global-bundle.pem:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - brbs-net

  # FastAPI WebSocket 챗봇(RAG+가드레일+LLM). SQS·S3 없음, Redis 필수.
  chatbot:
    image: ${ECR_REGISTRY}/soma/chatbot:${CHATBOT_TAG:-dev}
    container_name: brbs-chatbot
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      LOG_LEVEL: ${LOG_LEVEL}
      SERVICE_NAME: chatbot
      INSTANCE_ID: ${INSTANCE_ID:-}
      DATABASE_URL: ${DATABASE_URL}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-2}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      RDS_CA_PATH: ${RDS_CA_PATH:-}
      REDIS_URL: ${REDIS_URL}
      AI_BASE_URL: ${AI_BASE_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
      LLM_MODEL: ${LLM_MODEL}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIM: ${EMBEDDING_DIM}
      USE_NER: ${USE_NER:-false}
      NER_MODEL: ${NER_MODEL:-}
      NER_SCORE_THRESHOLD: ${NER_SCORE_THRESHOLD:-}
      TZ: Asia/Seoul
    volumes:
      - /home/ubuntu/backend/certs/rds-global-bundle.pem:/etc/ssl/rds/global-bundle.pem:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - brbs-net

  redis:
    image: redis:7-alpine
    container_name: brbs-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - brbs-net

  # ── 관측성 스택: 앱 인스턴스 상주 에이전트 (#88, #214 모니터링 인스턴스 분리) ──
  # prometheus·grafana·loki·tempo는 docker-compose.monitoring.yml로 분리해 별도 모니터링 인스턴스에서 띄운다.
  # 아래 셋(node-exporter·cadvisor·alloy)은 "이 호스트 자체"를 감시/수집하는 에이전트라 이동할 수 없다 —
  # 대신 모니터링 인스턴스가 원격으로 스크랩·push할 수 있도록 포트를 호스트에 게시한다.
  # 노출 범위는 보안그룹으로 좁힌다(모니터링 인스턴스 private IP發만 인바운드 허용, 외부 미노출).

  # 시스템 메트릭(CPU·메모리·디스크·네트워크). 모니터링 인스턴스(10.0.11.48)가 9100으로 원격 스크랩.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: brbs-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - brbs-net

  # 컨테이너 메트릭. 모니터링 인스턴스(10.0.11.48)가 8082로 원격 스크랩.
  # 호스트 포트는 8082(8080은 backend 앱 포트와 충돌, 8001은 chatbot과 충돌이라 회피).
  cadvisor:
    # dev EC2의 Docker는 containerd 이미지 스토어(storage driver: overlayfs)를 쓰는데, 구버전(v0.49.1)은
    # classic overlay2 전용 경로(image/…/layerdb)에서 RW 레이어를 찾다 실패해 컨테이너 등록 자체가
    # 전멸했다("Failed to create existing container" → container_* 메트릭 no data). v0.55.x에서
    # 이 이미지 스토어를 처리하도록 개선돼(실측: 레이어 에러 0·컨테이너 이름 라벨 정상), 버전 범프로 해소.
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: brbs-cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "8082:8080"
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - brbs-net

  # Alloy: Docker 데몬의 모든 컨테이너 stdout을 수집해 (원격) Loki로 push. docker.sock을 read-only로 마운트한다.
  # docker.sock은 이 호스트(backend·report·chatbot·redis가 뜨는 곳) 것이라 alloy 자체는 이동 불가 —
  # push 대상만 config.alloy에서 원격 Loki(모니터링 인스턴스)를 가리키도록 변경(플레이스홀더, PR로 실제 IP 채움).
  # 12345(자체 상태 UI)도 모니터링 인스턴스의 Prometheus가 alloy job으로 원격 스크랩하므로 호스트 전체 게시.
  # ⚠️ docker.sock 권한: 이미지 기본 사용자로 못 읽으면 `user: root` 또는 `group_add: [docker]` 추가.
  alloy:
    image: grafana/alloy:v1.5.1
    container_name: brbs-alloy
    restart: unless-stopped
    ports:
      - "12345:12345"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    mem_limit: 128m
    mem_reservation: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - brbs-net

volumes:
  redis-data:
  alloy-data:

networks:
  brbs-net:
    driver: bridge
