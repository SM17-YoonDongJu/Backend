# Grafana 데이터소스 provisioning — 콜로케이트된 Prometheus를 기본 소스로 등록 (#88)
apiVersion: 1
datasources:
  - name: Prometheus
    # 고정 uid — 파일 프로비저닝 대시보드 JSON이 이 uid로 데이터소스를 참조한다(${DS_*} 치환값).
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
