# 로컬 개발 전용 프로파일. 배포 대상(dev=스테이징, prod=운영)과 분리해 로컬 편의 설정과
# dev 전용 로그인을 여기에만 둔다. 실행: SPRING_PROFILES_ACTIVE=local ./gradlew bootRun
# datasource/redis 등은 application.yml 기본값(localhost)을 상속한다.
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  sqs:
    # LocalStack이 init-sqs.sh로 만드는 큐. application.yml은 폴백 없이 env를 요구하므로 로컬은 여기서 명시한다.
    ocr-queue-name: ocr-job-queue
  cookie:
    secure: false     # 로컬 http 개발
  docs:
    public: true      # Scalar API 문서를 인증 없이 개방
  dev-login:
    enabled: true     # dev 전용 로그인 엔드포인트 활성 (local은 배포 대상이 아니라 노출 위험 없음)

management:
  tracing:
    # 로컬엔 Tempo가 없다 — 트레이싱을 꺼서 OTLP export 시도·연결실패 경고를 막는다.
    enabled: false

aws:
  sqs:
    # 로컬 SQS는 LocalStack(docker compose)로 띄운다. 미기동 시 아웃박스 발행만 실패하고 앱 기동엔 영향 없다.
    endpoint: ${AWS_SQS_ENDPOINT:http://localhost:4566}

logging:
  level:
    org.springframework.security: DEBUG
