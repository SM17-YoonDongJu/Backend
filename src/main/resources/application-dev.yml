app:
  cookie:
    # 기본 false(백엔드가 평문 http일 때). cross-site(SameSite=None) HTTPS 배포 시
    # COOKIE_SECURE=true·COOKIE_SAME_SITE=None을 .env.dev로 주입한다(same-site는 application.yml에서 env 주입).
    secure: ${COOKIE_SECURE:false}
  docs:
    public: true    # dev 전용: Scalar 문서(/docs·/scalar.html·/v3/api-docs)를 인증 없이 개방
  cors:
    # dev 기본값에 Vercel 프론트 오리진 포함 (env로 덮어쓰기 가능)
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,https://frontend-web-psi-two.vercel.app}
  oauth:
    # Vercel 프론트가 인가요청에 쓴 redirect_uri(자기 오리진)를 토큰 교환에 그대로 허용
    allowed-redirect-origins: ${OAUTH_ALLOWED_REDIRECT_ORIGINS:http://localhost:8080,http://localhost:3000,https://frontend-web-psi-two.vercel.app}
  dev-login:
    # 부하테스트(k6) 전용 백도어. 평소엔 반드시 false — 로드테스트 창에만 .env.dev로 true를 주고
    # 창이 끝나면 false로 되돌린 뒤 backend를 재기동한다. prod는 DevLoginGuard가 기동 자체를 막는다.
    enabled: ${DEV_LOGIN_ENABLED:false}
    # 공유 시크릿. 값이 있을 때만 X-Dev-Login-Key 헤더 검증이 켜진다(빈 값=검증 스킵).
    # dev는 외부에서 닿는 서버라 enabled=true로 여는 동안엔 반드시 채운다.
    # 로컬(application-local.yml)은 이 키를 두지 않아 기존처럼 헤더 없이 로그인된다.
    secret: ${DEV_LOGIN_SECRET:}

logging:
  # 콘솔·파일 로그를 구조화 JSON(logstash)으로 출력 → Alloy가 Loki로 수집·필드 필터, traceId로 Tempo 상관.
  # dev 로그는 Loki로 중앙 수집되므로 프레임워크 verbose(SQL·security DEBUG)는 끈다 — 신호를 덮는 노이즈라서.
  # show-sql(stdout)도 제거: org.hibernate.SQL 로깅과 중복이고, format_sql 멀티라인이 Loki에서 줄 단위로 파편화됨.
  # SQL·security 상세는 로컬 콘솔(local 프로파일)에서 보고, dev에서 급히 볼 땐 런타임에 POST /actuator/loggers로 조정.
  # 트레이싱이 켜지면 Micrometer가 MDC에 traceId·spanId를 채우고, logstash 구조화 포맷이 이를
  # 자동으로 JSON 필드로 넣는다(별도 커스터마이저 불필요). 과거 커스터마이저로 traceId를 중복 주입해
  # "name 'traceId' has already been written"으로 in-span 로그가 통째로 유실됐던 이슈를 제거함.
  structured:
    format:
      console: logstash
      file: logstash
