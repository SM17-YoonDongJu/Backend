# Grafana 대시보드 provisioning — /var/lib/grafana/dashboards 의 JSON을 자동 로드 (#88)
# 여기에 매핑된 폴더(deploy/monitoring/grafana/dashboards)에 대시보드 JSON을 넣으면 기동 시 자동 등록된다.
apiVersion: 1
providers:
  - name: brbs-dashboards
    orgId: 1
    folder: BRBS
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
