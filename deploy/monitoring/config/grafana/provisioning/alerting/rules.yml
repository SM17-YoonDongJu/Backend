                  type: query

      # ollama는 HTTP 스크랩 대상이 아니라(무인증 서버) 컨테이너 생존을 cAdvisor(g6)로 본다 — OcrWorkerDown과 동형.
      - uid: brbs-ollama-down
        title: "OllamaDown - ollama 컨테이너 없음"
        condition: C
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "ollama(brbs-ollama) 컨테이너가 보이지 않음"
          description: "5분 이상 cAdvisor(g6)에 brbs-ollama가 없다 — 컨테이너가 죽었거나 이름이 바뀌었다. ollama가 없으면 report·chatbot의 LLM/임베딩과 ocr-worker 임베딩이 전부 실패한다. g6에서 docker ps·docker logs brbs-ollama 확인."
        noDataState: OK
        execErrState: OK
        # ⚠️ g6(brbs-ai)가 stopped인 동안 absent()가 상시 1이라 영구 발화한다 — 인스턴스 재기동 +
        # prometheus.yml의 cadvisor-gpu 잡 주석 해제와 함께 unpause할 것(#328 시점 pause).
        isPaused: true
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            # absent()는 시계열이 있으면 빈 결과(→NoData=OK로 침묵), 없으면 1을 낸다.
            model:
              expr: 'absent(container_last_seen{name="brbs-ollama"})'
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      # ── 약관 인덱싱(insurance-chunker, brbs-etl) ──
      # 배치 잡이라 알림 규칙이 다르다. 주기가 7일(INGEST_INTERVAL_SECONDS=604800)이므로 7일 중 6일 23시간 동안
      # 처리량 0이 정상이다 — "5분간 처리 0건" 같은 활동 기반 룰은 상시 발화하므로 두지 않는다.
      # 주 신호는 rate가 아니라 신선도 게이지이고, 컨테이너 자체가 죽는 건 기존 TargetDown이 커버한다.

      - uid: brbs-index-stale
        title: "IndexStale - 약관 인덱싱이 한 주기 반 넘게 성공하지 못함"
        condition: C
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "약관 인덱싱 신선도 초과 — 마지막 성공이 10.5일을 넘겼다"
          description: "이 서비스의 유일한 진짜 SLI다. 임계 907200s는 컨테이너 healthcheck.py와 같은 식(주기 604800 x HEALTH_GRACE_FACTOR 1.5)이라 앱 쪽 grace factor를 바꾸면 이 룰도 같이 바꿔야 한다. 데몬은 사이클이 실패해도 예외를 삼키고 다음 주기를 기다리므로 컨테이너는 running인 채로 몇 주째 인덱싱이 안 될 수 있다. brbs-etl에서 docker logs brbs-insurance-chunker 확인."
        noDataState: OK
        execErrState: OK
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            # 604800(7d) x 1.5 = 907200s. 아래 threshold의 숫자가 이 식의 결과다.
            model:
              expr: 'time() - insurance_chunker_last_success_timestamp_seconds'
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [907200]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      - uid: brbs-index-cycle-failed
        title: "IndexCycleFailed - 마지막 인덱싱 사이클 실패"
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "약관 인덱싱 사이클이 실패로 끝났다"
          description: "IndexStale은 마지막 성공이 10.5일을 넘겨야 울리므로, 사이클이 실패해도 그때까지는 아무 신호가 없다. 이 룰이 그 간극을 메운다 — 실패를 몇 분 안에 알린다. 데몬은 사이클이 죽어도 다음 주기를 기다리며 살아 있으므로 컨테이너 상태로는 구분되지 않는다. brbs-etl에서 docker logs brbs-insurance-chunker 확인. 상태 파일이 빈 새 볼륨에서는 첫 사이클이 끝나기 전까지 0이라 IndexNeverSucceeded와 같이 울린다."
        noDataState: OK
        execErrState: OK
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            # 재시작으로는 오발화하지 않는다 — record_start()가 기존 상태에 기동 시각만 덧쓰고
            # last_run_ok는 그대로 두므로, 직전 사이클 결과가 볼륨에 남아 있다.
            model:
              expr: 'insurance_chunker_last_cycle_success'
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      - uid: brbs-index-never-succeeded
        title: "IndexNeverSucceeded - 약관 인덱싱 성공 기록이 아예 없음"
        condition: C
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "insurance_chunker_last_success_timestamp_seconds 시계열이 없다"
          description: "함정 대응 룰이다. exporter는 last_success_at이 있을 때만 이 지표를 내보내므로, 한 번도 성공한 적이 없으면 시계열 자체가 없고 IndexStale의 뺄셈은 빈 결과가 된다(NoData=OK로 조용히 침묵). 즉 '한 번도 성공 못 한' 최악의 상태를 신선도 룰이 못 잡는다. 스크랩 타깃이 통째로 죽어도 같이 발화하지만 그건 TargetDown(2m)이 먼저 알려준다. 첫 사이클이 성공하면 자동으로 해제되고 이후로는 IndexStale이 이어받는다."
        noDataState: OK
        execErrState: OK
        # ⚠️ brbs-etl이 stopped인 동안 absent()가 상시 1이라 영구 발화한다 — 인스턴스 재기동 +
        # prometheus.yml의 insurance-chunker 잡 주석 해제와 함께 unpause할 것(#328 시점 pause).
        isPaused: true
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            # absent()는 시계열이 있으면 빈 결과(→NoData=OK로 침묵), 없으면 1을 낸다.
            model:
              expr: 'absent(insurance_chunker_last_success_timestamp_seconds)'
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      - uid: brbs-index-quarantined
        title: "DocumentsQuarantined - 재시도 상한에 걸린 문서 발생"
        condition: C
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "격리된 약관 문서 {{ $values.A }}건 — 이번 주기에 손도 대지 않았다"
          description: "재시도 상한(INGEST_MAX_RETRY, 기본 3)에 걸려 사이클이 건너뛴 문서다. 사이클 자체는 성공으로 찍히기 때문에 이 룰이 없으면 특정 문서만 조용히 진도가 안 나가는 상태를 못 본다. 해당 문서가 다시 성공하면 시도 횟수가 리셋돼 자동 해제된다. 어떤 문서인지는 brbs-etl의 /data/state/attempts.json에 남는다."
        noDataState: OK
        execErrState: OK
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'insurance_chunker_quarantined_documents'
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      - uid: brbs-index-weak-boundary
        title: "WeakBoundaryDocuments - 경계 검출이 약한 문서 발생"
        condition: C
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "경계 신뢰도 weak 문서 {{ $values.A }}건 — 적재는 됐지만 조번호가 어긋난다"
          description: "섹션 경계를 못 잡아 조번호가 어긋난 채로 적재된 문서다. status는 OK로 남기 때문에 이 지표가 없으면 품질 저하가 성공으로 집계된다. ⚠️ items.jsonl(append-only) 누적이라 값이 내려가지 않는다 — 한 번 발화하면 원인 문서를 다시 인덱싱해도 해제되지 않으므로, 확인 후 Grafana에서 silence를 걸고 다음 증가를 보는 식으로 운영해야 한다. 증가분만 보려면 delta(...[7d]) > 0 으로 바꿔야 하는데, 우선 절대량으로 존재 자체를 드러낸다."
        noDataState: OK
        execErrState: OK
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'insurance_chunker_weak_boundary_documents'
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      # ── k8s 클러스터 상태(soma-k8s, #328) — remote_write된 kube_*·up 시계열 기반, 중앙에서 평가 ──
      # 노드 CPU·메모리·디스크는 기존 HighCpu·HighMemory·DiskFilling이 node-exporter DaemonSet 시계열로
      # 이미 커버한다(instance 라벨 기준이라 클러스터 노드가 자동 포함). 여기는 k8s 고유 신호만 다룬다.

      - uid: brbs-k8s-collect-stopped
        title: "K8sCollectStopped - soma-k8s 수집 파이프라인 중단"
        condition: C
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "soma-k8s 메트릭이 중앙에 더 이상 도착하지 않음"
          description: "클러스터발 up 시계열이 전부 사라졌다(staleness 5분 경과 후 absent가 1이 된다). TargetDown은 up==0만 보므로 시계열 소멸 — 클러스터 Prometheus 다운·remote_write 단절·SG 변경 — 은 이 룰만 잡는다. CP에서 kubectl -n monitoring get pods 와 prometheus 파드 로그의 remote_write 에러를 확인."
        noDataState: OK
        execErrState: OK
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            # absent()는 시계열이 있으면 빈 결과(→NoData=OK로 침묵), 없으면 1을 낸다.
            model:
              expr: 'absent(up{cluster="soma-k8s"})'
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      - uid: brbs-k8s-pod-crashloop
        title: "K8sPodCrashLooping - 파드 크래시루프"
        condition: C
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "크래시루프: {{ $labels.namespace }}/{{ $labels.pod }}"
          description: "10분 넘게 CrashLoopBackOff 대기 상태가 관측됐다. 백오프 사이에 잠깐 Running으로 돌아오는 플랩은 max_over_time(10m)으로 눌렀다. kubectl -n <ns> logs <pod> --previous 또는 Loki {namespace=\"<ns>\", pod=\"<pod>\"}로 마지막 스택을 확인."
        noDataState: OK
        execErrState: OK
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'max by (namespace, pod) (max_over_time(kube_pod_container_status_waiting_reason{cluster="soma-k8s", reason="CrashLoopBackOff"}[10m]))'
              instant: true
              range: false
              refId: A
              legendFormat: "{{namespace}}/{{pod}}"
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      - uid: brbs-k8s-deploy-unavailable
        title: "K8sDeploymentUnavailable - 디플로이 가용 레플리카 부족"
        condition: C
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "가용 레플리카 부족: {{ $labels.namespace }}/{{ $labels.deployment }}"
          description: "10분 넘게 spec 대비 available이 모자라다 — 크래시루프·스케줄 불가·이미지 풀 실패 등 원인과 무관한 공통 증상이다. report·ocr-worker는 ReportWorkerDown·OcrWorkerDown(critical)이 따로 보고 이 룰은 backend를 포함한 전 디플로이를 warning으로 커버한다. kubectl -n <ns> describe deploy <이름>으로 원인을 확인."
        noDataState: OK
        execErrState: OK
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'sum by (namespace, deployment) (kube_deployment_spec_replicas{cluster="soma-k8s"} - kube_deployment_status_replicas_available{cluster="soma-k8s"})'
              instant: true
              range: false
              refId: A
              legendFormat: "{{namespace}}/{{deployment}}"
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      # ── Cilium CNI·Hubble (soma-k8s, #328) — CNI를 Calico eBPF→Cilium으로 전환(2026-10-04)하며 추가.
      # 에이전트 크래시루프는 K8sPodCrashLooping이 이미 잡으므로 여기는 스크랩 생존(up)과
      # 데이터플레인 증상(드롭률)만 본다. 메트릭 경로: cilium ServiceMonitor(release=kps) → KPS → remote_write.

      - uid: brbs-cilium-agent-down
        title: "CiliumAgentDown - Cilium 에이전트 스크랩 실패"
        condition: C
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Cilium 에이전트 다운: {{ $labels.instance }}"
          description: "해당 노드의 cilium-agent 메트릭 스크랩이 5분째 실패했다(up==0). 에이전트가 죽어도 커널에 로드된 BPF로 기존 연결은 계속 흐르지만, 새 파드 네트워킹·NetworkPolicy 갱신·서비스 변경 반영은 전부 멈춘다. CP에서 cilium status 와 kubectl -n kube-system get pods -l k8s-app=cilium 으로 확인. 워커 쪽만 다운이면 메트릭 포트 SG(9962-9965) 변경 여부도 의심."
        noDataState: OK
        execErrState: OK
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            # 1-up: 다운이면 1, 정상이면 0 — up==0 필터식은 남는 값이 0이라 threshold(gt 0)에 안 걸린다.
            model:
              expr: 'sum by (instance) (1 - up{cluster="soma-k8s", job="cilium-agent"})'
              instant: true
              range: false
              refId: A
              legendFormat: "{{instance}}"
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      - uid: brbs-hubble-drops-high
        title: "HubbleDropsHigh - 패킷 드롭 지속 발생"
        condition: C
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "soma-k8s 패킷 드롭이 10분 넘게 지속"
          description: "Hubble 집계 드롭률(hubble_drop_total)이 초당 1개를 10분 넘게 유지 — NetworkPolicy 오적용·대상 포트 불일치·서비스 셀렉터 미스(백엔드 부재)가 흔한 원인이다. CP에서 cilium hubble port-forward 후 hubble observe --verdict DROPPED --last 50 으로 어떤 플로우가 어떤 사유로 떨어지는지 바로 보인다. 정책 변경 직후라면 해당 네임스페이스 정책 누락부터 확인."
        noDataState: OK
        execErrState: OK
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            # 드롭이 한 번도 없으면 시계열 자체가 없어 NoData=OK로 침묵한다(정상).
            model:
              expr: 'sum(rate(hubble_drop_total{cluster="soma-k8s"}[5m]))'
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query
