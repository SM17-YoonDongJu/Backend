spring:
  application:
    name: brbs-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
    include:
      - oauth
  
  jackson:
    property-naming-strategy: SNAKE_CASE
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:brbs_dev}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  
  flyway:
    enabled: true
    locations: classpath:db/migration
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    security:
      protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}

server:
  port: 8080
  compression:
    enabled: true

jwt:
  secret: ${JWT_SECRET:localdevonlysecretkeyatleast32chars!!}
  access-token-expiry: 1800000    # 30분
  refresh-token-expiry: 1209600000 # 14일

app:
  cookie:
    secure: ${COOKIE_SECURE:true}      # 운영 https 기본값. 로컬 http는 프로파일에서 false
    # 프론트(Vercel)와 백엔드가 다른 사이트(cross-site)로 배포되면 쿠키가 XHR에 실리도록
    # 운영에선 COOKIE_SAME_SITE=None + COOKIE_SECURE=true(https 필수)로 주입한다. 로컬은 Lax.
    same-site: ${COOKIE_SAME_SITE:Lax}
  cors:
    # 쿠키 인증이라 와일드카드(*) 불가 → 패턴 목록으로 관리. 로컬 기본값만 채우고
    # 운영/프리뷰 오리진은 CORS_ALLOWED_ORIGIN_PATTERNS로 주입(쉼표 구분).
    # 예: https://앱운영도메인,https://*.vercel.app
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000}

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${S3_BUCKET:}
  # credentials 제거: EC2 IAM Role 자동 인증 사용
  # 로컬 개발 시엔 ~/.aws/credentials 사용

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.soma.backend: DEBUG
