# Loki 설정 (single-binary) — 로그 저장·검색. t3 콜로케이트, 외부 미노출(compose에서 127.0.0.1 바인딩).
# 저장은 로컬 파일시스템(Prometheus 15d TSDB와 동일 철학) + 7일 보존. 스케일업 시 object_store를 s3로 교체.
# 이 파일은 grafana provisioning처럼 deploy/monitoring/ 로 관리하며 서버에서 직접 편집하지 않는다.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    # TSDB v13 — Loki 3.x 권장 인덱스 스키마.
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h            # 7일 보존 (compactor가 강제)
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 8              # t3 보수값 — 초당 인제스트 상한
  ingestion_burst_size_mb: 16
  max_label_names_per_series: 30
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true          # retention_period 초과 청크 삭제
  delete_request_store: filesystem
  compaction_interval: 10m

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules

# 익명 사용 통계 전송 비활성(Prometheus/Grafana의 리포팅 비활성과 동일 정책)
analytics:
  reporting_enabled: false
