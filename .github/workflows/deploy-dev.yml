name: Deploy to Dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  ECR_REPOSITORY: soma/backend
  # dev 클러스터는 Argo CD가 K8s-manifests 레포를 보고 배포한다(#332).
  MANIFESTS_REPOSITORY: K8s-manifests
  MANIFESTS_VALUES_FILE: envs/dev/backend.values.yaml
  DEV_API_BASE_URL: https://api-dev.brbosang.com
  # 모니터링 스택(prometheus·grafana·loki·tempo) 전용 인스턴스 — #214 t3 콜로케이트에서 분리.
  EC2_MONITORING_INSTANCE_NAME: brbs-monitoring
  EC2_USER: ubuntu
  EC2_HOME: /home/ubuntu

jobs:
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}
      image_uri: ${{ steps.meta.outputs.image_uri }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: meta
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY"
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

      # BuildKit + GitHub Actions 캐시(type=gha)로 의존성 레이어를 재사용한다.
      # 멀티스테이지라 mode=max여야 builder 스테이지(gradlew dependencies)까지 캐시된다.
      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # dev 태그는 "가장 최근 dev 빌드" 표시용으로만 남긴다. k8s 매니페스트는 커밋 해시 태그만 쓴다
          # (이름이 그대로인 태그는 매니페스트가 안 바뀌어 Argo CD가 반영하지 않는다).
          tags: |
            ${{ steps.meta.outputs.image_uri }}:${{ github.sha }}
            ${{ steps.meta.outputs.image_uri }}:${{ steps.meta.outputs.short_sha }}
            ${{ steps.meta.outputs.image_uri }}:dev
          # /actuator/info의 app.commit — 아래 verify-deploy가 이 값으로 새 이미지가 떴는지 확인한다.
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 클러스터에 직접 배포하지 않고 K8s-manifests의 dev 이미지 태그만 바꿔 커밋한다.
  # 실제 반영(Sync·롤링 재시작)은 Argo CD가 레포를 보고 3분 안에 한다.
  # 떠다니는 dev 태그는 매니페스트가 안 바뀌어서 Argo CD가 아무 일도 하지 않으므로 커밋 해시 태그를 쓴다.
  update-manifests:
    name: Update K8s Manifests (dev image tag)
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      # brbs-manifests-ci 앱 토큰. K8s-manifests 한 레포의 contents 쓰기로만 범위를 좁힌다.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MANIFESTS_CI_CLIENT_ID }}
          private-key: ${{ secrets.MANIFESTS_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.MANIFESTS_REPOSITORY }}
          permission-contents: write

      - name: Checkout K8s-manifests
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ env.MANIFESTS_REPOSITORY }}
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: manifests

      - name: Commit dev image tag
        working-directory: manifests
        env:
          SHORT_SHA: ${{ needs.build-and-push.outputs.short_sha }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # 0809509처럼 숫자로만 된 해시는 따옴표가 없으면 YAML이 숫자로 읽어 이미지 주소가 깨진다.
          yq -i '.image.tag = strenv(SHORT_SHA) | .image.tag style="double"' "$MANIFESTS_VALUES_FILE"
          if git diff --quiet; then
            echo "이미 $SHORT_SHA 태그라 커밋하지 않습니다."
            exit 0
          fi

          BOT_ID=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -am "chore(dev): backend 이미지를 ${SHORT_SHA}로 갱신" \
            -m "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}" \
            -m "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # 다른 커밋이 먼저 들어가 push가 거절되면 최신 main 위로 다시 올려서 재시도한다.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push 실패(${attempt}/3) — 최신 main 위로 다시 올립니다."
            git pull --rebase origin main
          done
          echo "::error::K8s-manifests main에 push하지 못했습니다."
          exit 1

  # CI는 클러스터 권한이 없으므로 밖에서 확인한다. api-dev /actuator/info가 이번 커밋을 응답하면
  # 새 이미지가 실제로 떠서 트래픽을 받는 것이고, /v3/api-docs 200까지 봐서 앱 기동도 확인한다
  # (배포 성공과 앱 기동은 별개라는 교훈). Argo CD 확인 주기 3분 + 기동·readiness를 감안해 최대 15분 기다린다.
  verify-deploy:
    name: Verify Dev Rollout
    needs: update-manifests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Wait for api-dev to serve this commit
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          for i in $(seq 1 60); do
            COMMIT=$(curl -fsS -m 10 "$DEV_API_BASE_URL/actuator/info" | jq -r '.app.commit // "none"' || echo "unreachable")
            echo "[$i/60] api-dev app.commit: $COMMIT"
            if [ "$COMMIT" = "$EXPECTED_COMMIT" ]; then
              curl -fsS -m 10 -o /dev/null "$DEV_API_BASE_URL/v3/api-docs"
              echo "api-dev가 이번 커밋으로 응답하고 /v3/api-docs도 200입니다."
              exit 0
            fi
            sleep 15
          done
          echo "::error::15분 안에 api-dev가 이번 커밋으로 바뀌지 않았습니다. Argo CD에서 backend-dev 상태를 확인하세요."
          exit 1

  # deploy-monitoring을 돌릴지 미리 판별 — 모니터링 관련 파일이 안 바뀌었으면 스킵한다.
  # (매 push마다 4개 컨테이너를 force-recreate하면 스크랩·push가 잠깐 끊겨 타깃다운 알림이 튄다)
  detect-monitoring-changes:
    name: Detect Monitoring Changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.monitoring }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check monitoring paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          # 비워 두면 기본 브랜치(main)와의 merge-base부터 비교해 develop에 쌓인 변경이 매번 잡힌다.
          # push된 브랜치를 주면 push 직전 커밋(before)과 비교해 이번 push로 들어온 변경만 본다.
          base: ${{ github.ref_name }}
          filters: |
            monitoring:
              - 'deploy/monitoring/**'

  # 모니터링 인스턴스(brbs-monitoring)에 prometheus·grafana·loki·tempo 동기화 (#214).
  # ECR 이미지가 아니라 공개 이미지(prom/grafana 등)라 build-and-push에 의존하지 않고 독립적으로 돈다.
  # 모니터링 관련 파일 변경 시에만 돌고(위 detect-monitoring-changes), workflow_dispatch로는 무조건 강제 실행 가능.
  deploy-monitoring:
    name: Deploy Monitoring Stack via SSM
    needs: detect-monitoring-changes
    if: needs.detect-monitoring-changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    # EC2가 레포 tarball을 직접 받으므로(아래 참고) 러너 쪽 checkout이 필요 없다.
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Find monitoring EC2 instance
        id: find-instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$EC2_MONITORING_INSTANCE_NAME" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" == "None" ]; then
            echo "::error::Running instance with tag Name=$EC2_MONITORING_INSTANCE_NAME not found"
            exit 1
          fi

          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "Found: $INSTANCE_ID"

      - name: Deploy via SSM
        env:
          INSTANCE_ID: ${{ steps.find-instance.outputs.instance_id }}
        run: |
          # deploy/monitoring/ 동기화 — compose는 ~/monitoring/docker-compose.yml 로, 마운트되는 설정은 config/ 로 그대로 옮긴다.
          # rm -rf 에 구 레이아웃의 monitoring/ 을 같이 둔 건 재배치(#345) 이전 서버에 남은 디렉터리를 한 번 걷어내기 위함이다.
          # 볼륨 바인드 마운트 대상이라 EC2 디스크에 실파일이 있어야 한다.
          # 예전엔 tar.gz를 base64로 SSM 커맨드에 실어 보냈는데, SSM 커맨드 한도(100KB) 보호용 90KB 가드에
          # 대시보드가 늘면서 실제로 걸렸다(#328 시점 실측 93KB — k8s 대시보드 5종을 더하면 130KB). 지금은
          # EC2가 이 커밋(github.sha)의 레포 tarball을 GitHub에서 직접 받아 풀므로 페이로드 한도가 없다.
          # 공개 레포라 토큰 없이 받는 방식이다 — 레포가 private로 전환되면 S3 presigned 경유로 바꿔야 한다.
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy monitoring stack" \
            --parameters "{
              \"commands\": [
                \"set -e\",
                \"cd $EC2_HOME/monitoring\",
                \"echo '===== 리포 tarball 다운로드 (커밋: $GITHUB_SHA) ====='\",
                \"curl -fsSL --retry 3 -o /tmp/repo-sync.tar.gz https://codeload.github.com/$GITHUB_REPOSITORY/tar.gz/$GITHUB_SHA\",
                \"rm -rf /tmp/repo-sync && mkdir -p /tmp/repo-sync\",
                \"tar -xzf /tmp/repo-sync.tar.gz -C /tmp/repo-sync --strip-components=1\",
                \"echo '===== compose·config 동기화(리포 기준, #214) ====='\",
                \"cp /tmp/repo-sync/deploy/monitoring/docker-compose.yml docker-compose.yml\",
                \"rm -rf config monitoring\",
                \"cp -R /tmp/repo-sync/deploy/monitoring/config config\",
                \"rm -rf /tmp/repo-sync.tar.gz /tmp/repo-sync\",
                \"echo '===== 관측성 컨테이너 재생성 (config rm -rf 재동기화로 bind 마운트가 stale해지므로 전부 다시 붙인다) ====='\",
                \"docker compose --env-file .env.dev up -d --force-recreate prometheus grafana loki tempo\",
                \"echo '===== 이미지 정리 ====='\",
                \"docker image prune -f\",
                \"echo '===== 배포 완료 ====='\"
              ],
              \"executionTimeout\": [\"600\"]
            }" \
            --output text \
            --query 'Command.CommandId')

          echo "Command ID: $COMMAND_ID"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "[$i/60] Status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deploy 성공"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text
                break
                ;;
              Failed|Cancelled|TimedOut)
                echo "::error::Deploy 실패: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardErrorContent' \
                  --output text
                exit 1
                ;;
            esac

            sleep 5
          done

  notify:
    name: Notify Discord
    needs: [build-and-push, update-manifests, verify-deploy, detect-monitoring-changes, deploy-monitoring]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify
        uses: ./.github/actions/discord-notify
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_DEPLOYMENT }}
          # 완료 = api-dev가 이번 커밋으로 실제 응답까지 확인됨(verify-deploy).
          # deploy-monitoring은 모니터링 파일 미변경 시 skipped가 정상이라 success와 함께 통과로 친다.
          status: ${{ (needs.build-and-push.result == 'success' && needs.update-manifests.result == 'success' && needs.verify-deploy.result == 'success' && (needs.deploy-monitoring.result == 'success' || needs.deploy-monitoring.result == 'skipped')) && 'success' || 'failure' }}
          title: 'Backend Dev 배포 ${{ (needs.build-and-push.result == ''success'' && needs.update-manifests.result == ''success'' && needs.verify-deploy.result == ''success'' && (needs.deploy-monitoring.result == ''success'' || needs.deploy-monitoring.result == ''skipped'')) && ''완료'' || ''실패'' }}'
          failed_step: ${{ needs.build-and-push.result != 'success' && '이미지 빌드' || needs.update-manifests.result != 'success' && 'K8s-manifests 태그 커밋' || needs.verify-deploy.result != 'success' && 'api-dev 반영 확인' || (needs.deploy-monitoring.result != 'success' && needs.deploy-monitoring.result != 'skipped') && '모니터링 배포' || '' }}
          service: backend
          environment: dev
          image_tag: ${{ needs.build-and-push.outputs.short_sha }}
