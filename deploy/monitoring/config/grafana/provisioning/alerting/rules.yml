# 알림 룰 27종 (#88 보너스 6종 + OCR·리포트 파이프라인 8종 + GPU 3종 + 약관 인덱싱 5종 + k8s 3종 #328 + Cilium 2종) — 1분 평가, BRBS 폴더.
# 설계 원칙:
#  - NoData → OK: dev 무트래픽·미배포 exporter(brbs-etl #257, brbs-ai) 침묵(오발화 방지)
#  - Error → OK, 단 TargetDown만 Error → Alerting: Prometheus(데이터소스) 자체 장애를 대표 1건으로 감지
#  - TargetDown은 job 무관 up 전체 커버 → brbs-etl·brbs-ai 타깃이 추가되는 순간 자동 커버(후속 룰 불필요)
#  - k8s 룰(#328)은 remote_write된 kube_*·up 시계열로 중앙에서 평가한다 — in-cluster Alertmanager는 켜지
#    않는다(알림 발송 경로를 기존 Discord 웹훅 하나로 일원화, 실험 클러스터에 별도 발송 경로를 두지 않는 결정)
#  - 임계값은 보수적 초기값 — 운영하며 튜닝
apiVersion: 1
groups:
  - orgId: 1
    name: brbs-alerts
    folder: BRBS
    interval: 1m
    rules:
      - uid: brbs-target-down
        title: "TargetDown - 스크랩 타깃 다운"
        condition: C
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "타깃 다운: {{ $labels.job }} / {{ $labels.instance }}"
          description: "2분 이상 스크랩 실패(up==0). 컨테이너 상태(docker ps)·네트워크를 확인. 이 룰만 Error=Alerting이라 Prometheus 장애 시에도 발화한다."
        noDataState: OK
        execErrState: Alerting
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'up'
              instant: true
              range: false
              refId: A
              legendFormat: "{{job}}/{{instance}}"
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      - uid: brbs-high-5xx
        title: "High5xxRate - HTTP 5xx 에러율 5% 초과"
        condition: C
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "backend 5xx 에러율이 5%를 초과"
          description: "5분 지속. 최소 트래픽 가드(>0.1 req/s)가 있어 저트래픽 오발화는 걸러진다. 앱 로그·최근 배포를 확인."
        noDataState: OK
        execErrState: OK
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: '(sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count[5m]))) and (sum(rate(http_server_requests_seconds_count[5m])) > 0.1)'
              instant: true
              range: false
              refId: A
              legendFormat: "5xx ratio"
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0.05]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      - uid: brbs-high-cpu
        title: "HighCpu - CPU 85% 초과"
        condition: C
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CPU 과부하: {{ $labels.instance }}"
          description: "10분 지속 85% 초과. t3는 콜로케이트(앱+인프라+모니터링)라 원인 컨테이너를 cost-optimization 대시보드 Top10에서 확인."
        noDataState: OK
        execErrState: OK
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: '100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)'
              instant: true
              range: false
              refId: A
              legendFormat: "{{instance}}"
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [85]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      - uid: brbs-high-memory
        title: "HighMemory - 메모리 90% 초과"
        condition: C
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "메모리 압박: {{ $labels.instance }}"
          description: "10분 지속 90% 초과 — OOM 전조. 컨테이너별 소비는 cost-optimization 대시보드에서 확인."
        noDataState: OK
        execErrState: OK
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: '(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100'
              instant: true
              range: false
              refId: A
              legendFormat: "{{instance}}"
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [90]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      - uid: brbs-disk-filling
        title: "DiskFilling - 디스크 80% 초과"
        condition: C
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "디스크 사용률 80% 초과: {{ $labels.instance }}"
          description: "TSDB(retention 15d)·로그·kafka 데이터 축적 확인. 7일 예측은 cost-optimization 대시보드 참조."
        noDataState: OK
        execErrState: OK
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: '(1 - (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"})) * 100'
              instant: true
              range: false
              refId: A
              legendFormat: "{{instance}}"
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [80]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      - uid: brbs-hikari-saturated
        title: "HikariSaturated - DB 커넥션 풀 대기 발생"
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HikariCP 대기 스레드 발생(풀 포화)"
          description: "5분 지속 pending>0 — 커넥션을 못 받은 요청이 대기 중. 느린 쿼리·풀 크기(maximum-pool-size)·커넥션 누수를 확인."
        noDataState: OK
        execErrState: OK
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'hikaricp_connections_pending'
              instant: true
              range: false
              refId: A
              legendFormat: "{{pool}}"
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      # ── OCR·리포트 파이프라인(발행=backend → ocr-job-queue → ocr-worker → report-job-queue → report) ──
      # 두 워커 모두 AI 레포 소유이고 HTTP 서버가 없어 /metrics 스크랩이 불가하다(TargetDown 룰이 못 잡는다).
      # "떠 있는가"는 kube-state-metrics의 가용 레플리카로, "일을 하고 있는가"는 로그와 SQS 지표(CloudWatch)로 본다.
      # #328 이주 때 OCR 룰 두 개가 report를 OCR 워커로 보고 있었다 — OCR 워커(ocr-worker, K8s-manifests
      # charts/ocr-worker)가 클러스터에 생기면서 OCR 룰은 ocr-worker로 돌리고, report는 Report* 룰로 옮겼다.
      # 워커가 /metrics를 노출하면 K8s-manifests에 ServiceMonitor를 추가하고 여기에 처리량·실패율 룰을 추가한다.
      - uid: brbs-ocr-worker-down
        title: "OcrWorkerDown - OCR 워커 파드 없음"
        condition: C
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "OCR 워커(ocr-worker) 가용 파드가 없음"
          description: "5분 이상 ocr-worker Deployment의 가용 레플리카가 0이다 — 파드가 죽었거나 스케줄되지 못하고 있다. 워커는 메모리가 빠듯한 일반 워커(t3.large)에 뜨므로, OOMKilled·축출 뒤 자리가 없어 다시 뜨지 못해도(Pending) 이 상태다. 청구 서류 OCR이 멈추고 그 뒤 리포트도 나오지 않는다(메시지는 큐에 4일 보관). kubectl -n default get pods -l app.kubernetes.io/name=ocr-worker · kubectl -n default logs deploy/ocr-worker 확인."
        # NoData=Alerting 예외: 구 absent() 의미 승계 — Deployment가 삭제되거나 kube-state-metrics/remote_write가
        # 끊겨 시계열 자체가 사라져도 알린다(원칙 NoData→OK의 의도적 예외, TargetDown execErr 예외와 같은 결).
        noDataState: Alerting
        execErrState: OK
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'kube_deployment_status_replicas_available{cluster="soma-k8s", namespace="default", deployment="ocr-worker"}'
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      # 원래 OcrWorkerDown이 보던 대상(report)을 그대로 옮겼다 — 가용 레플리카 0을 critical로 보는 감시는 그대로다.
      - uid: brbs-report-worker-down
        title: "ReportWorkerDown - 리포트 워커 파드 없음"
        condition: C
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "리포트 워커(report) 가용 파드가 없음"
          description: "5분 이상 report Deployment의 가용 레플리카가 0이다 — 파드가 죽었거나 스케줄되지 못하고 있다. OCR이 끝난 청구의 리포트 작업(brbs-report-job-queue-dev)을 아무도 소비하지 않으므로 리포트 생성이 멈춘다(메시지는 큐에 4일 보관). kubectl -n default get pods · kubectl -n default logs deploy/report 확인."
        # NoData=Alerting — OcrWorkerDown과 같은 이유
        noDataState: Alerting
        execErrState: OK
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'kube_deployment_status_replicas_available{cluster="soma-k8s", namespace="default", deployment="report"}'
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      - uid: brbs-ocr-worker-not-consuming
        title: "OcrWorkerNotConsuming - OCR 워커가 큐를 읽지 못함"
        condition: C
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "OCR 워커가 SQS 수신에 반복 실패 중"
          description: "10분 넘게 'sqs receive failed'가 쏟아진다 — 컨테이너는 살아 있지만 큐를 못 읽는 상태다. SQS_OCR_JOB_QUEUE_URL 주입 여부(2026-08-13 실제 원인)·노드 롤 IAM(Receive/Delete)·IMDS 예외 라벨(aws-metadata=allow)·큐 이름을 확인. 발행은 정상인데 소비만 끊기면 이 룰만 발화한다."
        noDataState: OK
        execErrState: OK
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            # ⚠️ 워커(AI 레포 core/sqs/consumer.py)의 로그 문구에 의존한다 — 문구가 바뀌면 이 룰은 조용히 죽는다.
            # 정상 시 0건이라 NoData=OK로 침묵하고, 초당 1회 재시도가 5분 이어지면 ~300건이 된다.
            # service 라벨은 Alloy가 컨테이너 이름으로 붙인다(brbs-<컨테이너명>, K8s-manifests platform/alloy).
            model:
              refId: A
              expr: 'sum(count_over_time({service="brbs-ocr-worker"} |= "sqs receive failed" [5m]))'
              queryType: instant
              datasource:
                type: loki
                uid: loki
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [60]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      # report도 같은 소비 루프(core.sqs.consumer)라 같은 문구를 남긴다 — 원래 OcrWorkerNotConsuming이 보던 대상이다.
      - uid: brbs-report-worker-not-consuming
        title: "ReportWorkerNotConsuming - 리포트 워커가 큐를 읽지 못함"
        condition: C
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "리포트 워커가 SQS 수신에 반복 실패 중"
          description: "10분 넘게 'sqs receive failed'가 쏟아진다 — 컨테이너는 살아 있지만 큐를 못 읽는 상태다. SQS_REPORT_JOB_QUEUE_URL 주입 여부·노드 롤 IAM(Receive/Delete)·IMDS 예외 라벨(aws-metadata=allow)·큐 이름을 확인."
        noDataState: OK
        execErrState: OK
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            # ⚠️ OcrWorkerNotConsuming과 같은 문구 의존
            model:
              refId: A
              expr: 'sum(count_over_time({service="brbs-report"} |= "sqs receive failed" [5m]))'
              queryType: instant
              datasource:
                type: loki
                uid: loki
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [60]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      # 원인과 상관없이 "청구 서류가 처리되지 않는다"는 증상을 본다 — 워커가 없거나(미배포·brbs-etl 정지), 죽었거나,
      # 한 작업에 매달려 있으면 모두 여기 걸린다. 2026-11-05~06에 워커 없이 4건이 하루 넘게 쌓였는데 아무 알림도
      # 없었다(그때 OCR 룰은 report를 보고 있었다). 로그 룰은 워커가 없으면 조용하고, OcrWorkerDown은 파드가 살아
      # 있는 채 매달린 작업을 못 잡는다. 데이터는 CloudWatch AWS/SQS — 모니터링
      # 인스턴스 롤(CloudWatchReadOnlyAccess)로 읽는다. 처리 중인(invisible) 메시지도 나이에 들어가고 워커는 한 번에
      # 하나씩 처리하므로, 임계값은 정상 처리로도 생기는 대기보다 길어야 한다. OCR 엔진은 PaddleOCR(CPU)이고 일반
      # 워커(t3.large) 실측으로 쪽당 OCR 한 번이 32~39초다(2026-11-08, 쪽마다 두 번 돈다). VLM 예산(전사 210초 +
      # 재판독 90초)은 쪽마다가 아니라 서류마다 한 번이다(AI 레포 ocr_worker/pipeline.py — 전사 단계 전체에 마감 하나).
      # 그래서 12쪽 서류도 OCR 14분 + VLM 5분, 20분 안팎이고, 여러 장짜리 청구의 마지막 장도 1시간이면 충분하다.
      # 1시간을 넘긴 상태가 10분 이어져야 발화한다(for).
      - uid: brbs-ocr-queue-stale
        title: "OcrQueueStale - OCR 큐 메시지가 오래 처리되지 않음"
        condition: C
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "OCR 큐(brbs-ocr-job-queue-dev)의 가장 오래된 메시지가 1시간을 넘김"
          description: "가장 오래된 메시지가 1시간 넘게 큐에 있다 — 청구 서류가 OCR되지 않고 있다. OcrWorkerDown이 같이 울리면 파드부터 보고, 아니면 kubectl -n default logs deploy/ocr-worker로 매달린 작업을 본다. 메시지는 4일 뒤 SQS가 지우고, 그러면 그 청구는 리포트가 나오지 않는다."
        noDataState: OK
        execErrState: OK
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
