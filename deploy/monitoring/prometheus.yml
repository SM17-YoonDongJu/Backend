# Prometheus 스크랩 설정 — 모니터링 전용 인스턴스(brbs-monitoring) 상주 (#88, #214 인스턴스 분리)
# 같은 docker network(brbs-net)의 서비스(grafana·loki·tempo)는 컨테이너 이름으로, 앱 인스턴스(t3)·GPU(g6)는
# 원격이라 private IP로 스크랩한다.
# 이 파일은 grafana provisioning과 함께 deploy/monitoring/ 로 관리하며 서버에서 직접 편집하지 않는다.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: brbs-dev

scrape_configs:
  # Prometheus 자체
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # 관측성 스택 자체 메트릭(로그·트레이스 파이프라인 건강성). 모니터링 인스턴스 내부망(brbs-net) 스크랩.
  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets: ["loki:3100"]
        labels:
          instance: monitoring
  - job_name: tempo
    metrics_path: /metrics
    static_configs:
      - targets: ["tempo:3200"]
        labels:
          instance: monitoring

  # ── 앱(t3.brbs-backend-dev, 10.0.11.42) 시스템·컨테이너·앱 메트릭 — 원격 스크랩 ──
  # node-exporter·cadvisor·alloy·redis-exporter는 그 호스트를 감시하는 에이전트라 이동 불가(docker-compose.dev.yml 참고).
  # 보안그룹: 모니터링 인스턴스 → t3 인바운드로 9292·9100·8082·12345·9121 을 private(내부)만 허용.

  # Spring Boot 앱 메트릭 (HTTP·JVM·HikariCP)
  - job_name: brbs-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["10.0.11.42:9292"]
        labels:
          instance: t3-app

  # t3 시스템 메트릭 (CPU·메모리·디스크·네트워크)
  - job_name: node-t3
    static_configs:
      - targets: ["10.0.11.42:9100"]
        labels:
          instance: t3-app

  # t3 컨테이너 메트릭
  - job_name: cadvisor-t3
    static_configs:
      - targets: ["10.0.11.42:8082"]
        labels:
          instance: t3-app

  # Alloy(로그 수집 에이전트) 자체 상태 메트릭
  - job_name: alloy
    metrics_path: /metrics
    static_configs:
      - targets: ["10.0.11.42:12345"]
        labels:
          instance: t3-app

  # Redis 내부 지표 (ops/sec·히트율·evicted keys·connected clients 등)
  - job_name: redis-exporter
    static_configs:
      - targets: ["10.0.11.42:9121"]
        labels:
          instance: t3-app

  # ── GPU(g6.xlarge) 시스템·컨테이너 메트릭  ──
  # g6에 node_exporter(9100)·cAdvisor(8080) 배포 후, 그 private IP로 아래 주석을 해제한다.
  # 보안그룹: 모니터링 인스턴스 → g6 인바운드로 9100·8080 을 private(내부)만 허용(외부 노출 금지).
  # (인스턴스 분리 전엔 t3 → g6이었으나, 스크랩 주체가 모니터링 인스턴스로 바뀌었으므로 소스를 다시 잡아야 한다.)
  # - job_name: node-gpu
  #   static_configs:
  #     - targets: ["<G6_PRIVATE_IP>:9100"]
  #       labels:
  #         instance: g6-gpu
  # - job_name: cadvisor-gpu
  #   static_configs:
  #     - targets: ["<G6_PRIVATE_IP>:8080"]
  #       labels:
  #         instance: g6-gpu
