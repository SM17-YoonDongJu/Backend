name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Spotless check
        run: ./gradlew spotlessCheck
        continue-on-error: true

      - name: Checkstyle
        run: ./gradlew checkstyleMain
        continue-on-error: true

      - name: Build
        run: ./gradlew build -x test

      - name: Test
        run: ./gradlew test
        env:
          SPRING_PROFILES_ACTIVE: test
          LOG_DIR: /tmp/logs
          JWT_SECRET: testsecretkeyforcitestingonly32chars!!

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7

  notify:
    name: Notify CI Result
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify Discord
        uses: ./.github/actions/discord-notify
        with:
          webhook: ${{ needs.test.result == 'success' && secrets.DISCORD_WEBHOOK_CI_BUILDS || secrets.DISCORD_WEBHOOK_CI_FAILURES }}
          status: ${{ needs.test.result }}
          title: 'Backend CI ${{ needs.test.result == ''success'' && ''성공'' || ''실패'' }}'
          service: backend
          environment: dev