      - uid: brbs-ocr-job-failed
        title: "OcrJobFailed - OCR 작업 확정 실패"
        condition: C
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "OCR 작업이 확정 실패함(재처리하지 않음)"
          description: "10분 안에 OCR 작업이 확정 실패했다 — 재시도를 다 쓴 실패(ocr_job_failure_terminal)거나, 다시 해도 소용없는 실패(마스킹 잔류·읽을 수 없는 파일, sqs handler terminal failure)다. 그 서류는 ai.ocr_job_failures에 확정 실패로 남는다. job_id·failure_class는 {service=\"brbs-ocr-worker\"} |= \"ocr_job_failure_recorded\" 로 본다."
        noDataState: OK
        execErrState: OK
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            # ⚠️ 워커의 이벤트 이름(AI 레포 ocr_worker/__main__.py·core/sqs/consumer.py)에 의존한다.
            model:
              refId: A
              expr: 'sum(count_over_time({service="brbs-ocr-worker"} |~ "ocr_job_failure_terminal|sqs handler terminal failure" [10m]))'
              queryType: instant
              datasource:
                type: loki
                uid: loki
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      - uid: brbs-outbox-relay-failing
        title: "OutboxRelayFailing - OCR 트리거 발행 실패"
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "아웃박스 릴레이가 SQS 발행에 실패 중"
          description: "10분 내 발행 실패가 있었다. 5회를 넘기면 FAILED로 파킹돼 자동 재시도가 끝나므로(수동 복구 필요) 큐 이름(SQS_OCR_QUEUE_NAME)·IAM(SendMessage/GetQueueUrl)을 확인. 로그: {service=\"brbs-backend\"} |= \"아웃박스 이벤트 발행 실패\""
        noDataState: OK
        execErrState: OK
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            # OutboxRelay가 발행 결과를 카운터로 남긴다(outbox.relay.failed → outbox_relay_failed_total).
            # 이 메트릭이 배포되기 전에는 시계열이 없어 NoData=OK로 침묵한다.
            model:
              expr: 'sum(increase(outbox_relay_failed_total[10m]))'
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      # ── GPU(g6=brbs-ai, 10.0.11.93) — dcgm-exporter/cAdvisor 기반. dcgm-gpu·cadvisor-gpu 타깃 UP 시부터 평가 ──
      # 타깃 자체 다운은 기존 TargetDown(critical, 2m)이 커버하므로 여기선 GPU 고유 신호만 다룬다.
      - uid: brbs-gpu-vram-high
        title: "GpuVramHigh - GPU VRAM 95% 초과(포화·OOM 전조)"
        condition: C
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "GPU VRAM 포화: {{ $labels.instance }} gpu{{ $labels.gpu }}"
          description: "10분 지속 VRAM 95% 초과. 모델이 VRAM을 채우는 건 정상이나, ~100% 고정은 추가 로드 실패·언로드/재로드 스래싱(수십초 지연)·OOM 전조다(70b OOM 이력). ollama 로그의 unload/OOM과 gpu-dcgm 대시보드를 확인."
        noDataState: OK
        execErrState: OK
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'max by(instance, gpu) (DCGM_FI_DEV_FB_USED / (DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE))'
              instant: true
              range: false
              refId: A
              legendFormat: "{{instance}} gpu{{gpu}}"
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0.95]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      - uid: brbs-gpu-temp-high
        title: "GpuTempHigh - GPU 온도 85도 초과(스로틀링)"
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GPU 온도 과열: {{ $labels.instance }} gpu{{ $labels.gpu }}"
          description: "5분 지속 85℃ 초과 — 조용한 성능 저하(클럭 스로틀링) 구간. gpu-dcgm 대시보드에서 전력·SM clock 동반 하락을 확인. 지속되면 워크로드/냉각을 점검."
        noDataState: OK
        execErrState: OK
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'max by(instance, gpu) (DCGM_FI_DEV_GPU_TEMP)'
              instant: true
              range: false
              refId: A
              legendFormat: "{{instance}} gpu{{gpu}}"
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [85]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
